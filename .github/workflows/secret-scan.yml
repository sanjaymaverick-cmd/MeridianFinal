# IMP-08 — keys / .env in tree or PR diff must fail the PR.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Secret scan (tree + diff vs base)
        run: node scripts/secret-scan.mjs --ci
